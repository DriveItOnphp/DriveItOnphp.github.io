<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FYP Data Hosting</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fa;
      color: #333;
    }

    .container {
      max-width: 960px;
      margin: 80px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #2a2a2a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
    }

    th, td {
      padding: 12px;
      border: 1px solid #ccc;
      text-align: left;
    }

    th {
      background-color: #f0f0f0;
    }

    /* Modal Styling */
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal-content {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      max-width: 500px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    }

    .modal-content h2 {
      margin-top: 0;
    }

    .modal-content label {
      display: block;
      margin: 20px 0;
    }

    .modal-content button {
      padding: 10px 20px;
      background-color: #0077cc;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .modal-content button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="modal" id="welcomeModal">
    <div class="modal-content">
      <h2>Notice</h2>
      <p>This website is currently in an unfinished state as it is being used to host Final Year Project data.</p>
      <label>
        <input type="checkbox" id="agreeCheckbox" />
        I understand and agree to proceed.
      </label>
      <button id="agreeBtn" disabled>Enter Site</button>
    </div>
  </div>

  <div class="container" id="mainContent" style="display: none;">
    <h1>FYP Data Portal</h1>

    <p>Welcome! Below is the table for your FYP data.</p>

    <!-- Example Table -->
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Data Type</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Traffic Sample</td>
          <td>Benign web browsing data</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Attack Pattern</td>
          <td>Simulated DDoS burst from attacker VM</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const checkbox = document.getElementById('agreeCheckbox');
    const button = document.getElementById('agreeBtn');
    const modal = document.getElementById('welcomeModal');
    const mainContent = document.getElementById('mainContent');

    checkbox.addEventListener('change', function () {
      button.disabled = !this.checked;
    });

    button.addEventListener('click', function () {
      modal.style.display = 'none';
      mainContent.style.display = 'block';
    });
  </script>
</body>
</html>
